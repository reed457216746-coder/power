<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7fbf9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="能量管理" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="一个私密的自律签到与能量管理网页。" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <title>能量管理</title>
  </head>
  <body>
    <main class="app-shell" aria-label="能量管理签到网页">
      <header class="topbar">
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32">
              <path d="M27 5C15.6 5.6 7.9 12.3 6 27c6.2-2.4 10.9-6.3 14.1-11.7" />
              <path d="M7.5 22.5c5.6-1.4 10.3-4.7 14.1-10" />
            </svg>
          </span>
          <div>
            <h1>能量管理</h1>
            <p class="today-label" id="todayLabel">今天</p>
          </div>
        </div>
        <button class="icon-button" id="privacyToggle" type="button" aria-label="切换隐私显示">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 12s2.7-5 8-5 8 5 8 5-2.7 5-8 5-8-5-8-5Z" />
            <circle cx="12" cy="12" r="2.7" />
          </svg>
        </button>
      </header>

      <section class="streak-panel" aria-labelledby="streakTitle">
        <span class="leaf-deco left" aria-hidden="true"></span>
        <span class="leaf-deco right" aria-hidden="true"></span>
        <div class="streak-copy">
          <p id="streakTitle">连续坚持</p>
          <strong><span id="streakDays">0</span><small>天</small></strong>
          <em id="streakMantra">每一次选择，都是在成为更好的自己</em>
        </div>
        <div class="ring" aria-hidden="true">
          <span id="ringValue">0</span>
        </div>
      </section>

      <button class="checkin-button" id="checkinButton" type="button">
        <span id="checkinText">今日签到</span>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m5 12 4 4L19 6" />
        </svg>
      </button>

      <section class="saved-card" aria-label="节省时间统计">
        <div class="saved-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 7v5l3.4 2" />
          </svg>
        </div>
        <div class="saved-copy">
          <span>已节省</span>
          <strong id="savedHours">0 小时</strong>
          <p id="timeEquivalent">签到后会换算成具体收获</p>
        </div>
        <div class="bar-mini" aria-hidden="true">
          <i></i><i></i><i></i><i></i>
        </div>
      </section>

      <section class="mini-stat" aria-label="成功签到统计">
        <span>成功签到</span>
        <strong id="totalDays">0 天</strong>
      </section>

      <section class="quote-panel" aria-live="polite">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3.5 14.7 9l6 .9-4.3 4.2 1 5.9-5.4-2.9L6.6 20l1-5.9L3.3 9.9l6-.9L12 3.5Z" />
        </svg>
        <p id="encouragement">把能量留给真正想成为的自己。</p>
      </section>

      <section class="week-card" aria-labelledby="weekTitle">
        <div class="section-title">
          <h2 id="weekTitle">近7天记录</h2>
          <button id="resetToday" type="button">撤销今天</button>
        </div>
        <div class="week-row" id="weekRow"></div>
      </section>

      <section class="action-list" aria-label="快速行动">
        <button class="action-row urgent" id="urgeButton" type="button">
          <span class="action-icon" aria-hidden="true">!</span>
          <span>
            <strong>冲动急救</strong>
            <small>感觉困难时，点我获得支持</small>
          </span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m9 18 6-6-6-6" />
          </svg>
        </button>
        <button class="action-row" id="actionButton" type="button">
          <span class="action-icon" aria-hidden="true">↯</span>
          <span>
            <strong>替代行动</strong>
            <small id="suggestedAction">散步 10 分钟</small>
          </span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m9 18 6-6-6-6" />
          </svg>
        </button>
        <button class="action-row" id="noteButton" type="button">
          <span>
            <strong>记录诱因</strong>
            <small>无聊、压力、熬夜都可以写下</small>
          </span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m9 18 6-6-6-6" />
          </svg>
        </button>
      </section>

      <section class="settings-panel" aria-labelledby="settingsTitle">
        <div class="section-title">
          <h2 id="settingsTitle">节省时间估算</h2>
          <span>每次约 1 小时</span>
        </div>
        <label class="time-setting">
          <span>平均耗时</span>
          <input id="averageMinutes" type="number" min="10" max="240" step="5" inputmode="numeric" />
          <small>分钟</small>
        </label>
        <div class="backup-tools" aria-label="数据备份">
          <p>数据只存在本机，建议定期导出备份。</p>
          <div>
            <button id="exportBackup" type="button">导出备份</button>
            <button id="importBackup" type="button">导入备份</button>
          </div>
          <input id="backupFile" type="file" accept="application/json,.json" hidden />
        </div>
      </section>
    </main>

    <div class="sheet" id="sheet" hidden>
      <div class="sheet-backdrop" data-close-sheet></div>
      <section class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <button class="sheet-close" type="button" data-close-sheet aria-label="关闭">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l12 12M18 6 6 18" />
          </svg>
        </button>
        <h2 id="sheetTitle">冲动急救</h2>
        <div id="sheetContent"></div>
      </section>
    </div>

    <script src="./app.js" defer></script>
  </body>
</html>
